spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

external:
  ml:
    base-url: http://localhost:${wiremock.server.port:8080}
    endpoints:
      livability: /predict/livability
      roi: /predict/roi
  data:
    air-quality-url: http://mock-air-quality-api.com/data
    crime-url: http://mock-crime-api.com/data

scheduler:
  fixed-rate: 3600000

geospatial:
  default-radius-meters: 1000

resilience4j:
  circuitbreaker:
    instances:
      mlService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

jwt:
  secret: terraNestSuperSecretKey2026ForJwtSigningMustBe256BitsLong
  expiration-ms: 86400000

