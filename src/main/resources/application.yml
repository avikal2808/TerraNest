server:
  port: ${PORT:8080}

spring:
  application:
    name: neighborhood-intelligence
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nest}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:avikal}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cache:
    type: redis
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

external:
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:5000}
    endpoints:
      livability: /predict/livability
      roi: /predict/roi
  data:
    air-quality-url: http://mock-air-quality-api.com/data
    crime-url: http://mock-crime-api.com/data

scheduler:
  fixed-rate: 3600000

geospatial:
  default-radius-meters: 1000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [traceId=%X{traceId}] %msg%n"
  level:
    root: INFO
    ghost.nest: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      mlService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

jwt:
  secret: ${JWT_SECRET:terraNestSuperSecretKey2026ForJwtSigningMustBe256BitsLong}
  expiration-ms: 86400000  # 24 hours

